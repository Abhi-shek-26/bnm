<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Profile | BOOK N MEET</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --primary: #0061ff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --bg-gradient: linear-gradient(135deg, #f8faff 0%, #f1f5f9 100%);
      --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.04), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
    }

    body {
      background: var(--bg-gradient);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-dark);
      min-height: 100vh;
    }

    /* Glass Nav Bar */
    .glass-nav {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 15px 0;
    }

    .dashboard-btn {
      background: white;
      border: 1px solid #e2e8f0;
      color: var(--text-dark);
      font-weight: 600;
      border-radius: 12px;
      padding: 10px 20px;
      transition: 0.3s;
      text-decoration: none;
    }

    .dashboard-btn:hover {
      background: var(--text-dark);
      color: white;
    }

    /* Profile Banner */
    .profile-banner {
      background: linear-gradient(135deg, #0061ff 0%, #60efff 100%);
      height: 160px;
      border-radius: 0 0 40px 40px;
      width: 100%;
    }

    .main-card {
      background: white;
      border: 1px solid rgba(226, 232, 240, 0.6);
      border-radius: 30px;
      box-shadow: var(--card-shadow);
      padding: 40px;
      margin-top: -80px;
      position: relative;
    }

    /* Avatar Section */
    .avatar-wrapper {
      text-align: center;
      margin-bottom: 35px;
    }

    .avatar-circle {
      width: 130px;
      height: 130px;
      background: white;
      border-radius: 35px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      color: var(--primary);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      border: 6px solid white;
    }

    .status-badge {
      background: #ecfdf5;
      color: #10b981;
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Information Grid */
    .info-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .info-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .detail-box {
      background: #f8fafc;
      padding: 24px;
      border-radius: 20px;
      height: 100%;
      border: 1px solid #f1f5f9;
      transition: 0.3s ease;
    }

    .detail-box:hover {
      background: white;
      border-color: var(--primary);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.03);
    }

    .btn-edit {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 14px 35px;
      font-weight: 700;
      transition: 0.3s;
    }

    .btn-edit:hover {
      background: #004ecc;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 97, 255, 0.2);
      color: white;
    }
  </style>

</head>

<body>

  <nav class="glass-nav">
    <div class="container d-flex justify-content-between align-items-center">
      <h4 class="fw-800 mb-0"><i class="bi bi-heart-pulse-fill text-primary me-2"></i>BOOK N MEET</h4>
      <a href="{% url 'patient_viewbase' %}" class="dashboard-btn">
        <i class="bi bi-house-door me-2"></i>Dashboard
      </a>
    </div>
  </nav>

  <div class="profile-banner"></div>

  <div class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <div class="main-card">

          <div class="avatar-wrapper">
            <div class="avatar-circle">
              <i class="bi bi-person-badge"></i>
            </div>
            <h2 class="fw-800 mt-4 mb-2">{{ patient_data.patient_name }}</h2>
            <span class="status-badge">
                <i class="bi bi-patch-check-fill me-1"></i> Verified Profile
            </span>
          </div>

          <div class="row g-4">
            <div class="col-md-6">
              <div class="detail-box">
                <div class="info-label"><i class="bi bi-envelope-at me-2 text-primary"></i> Email</div>
                <div class="info-value text-truncate">{{ patient_data.email }}</div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="detail-box">
                <div class="info-label"><i class="bi bi-telephone me-2 text-primary"></i> Contact</div>
                <div class="info-value">{{ patient_data.phone|default:"---" }}</div>
              </div>
            </div>

            <div class="col-12">
              <div class="detail-box">
                <div class="info-label"><i class="bi bi-geo-alt me-2 text-primary"></i> Residential Address</div>
                <div class="info-value">{{ patient_data.address }}</div>
              </div>
            </div>
          </div>

          <div class="mt-5 pt-4 border-top d-flex justify-content-between align-items-center">
            <a href="{% url 'patient_viewbase' %}" class="text-decoration-none text-muted fw-700 small">
               <i class="bi bi-arrow-left me-1"></i> Back
            </a>
            <a href="{% url 'edit_patient_profile' %}" class="btn btn-edit">
              <i class="bi bi-pencil-square me-2"></i> Edit Profile
            </a>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
