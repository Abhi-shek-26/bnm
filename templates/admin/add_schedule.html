<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Schedule | BNM Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --sidebar-width: 260px;
            --primary: #0d6efd;
            --bg-body: #f4f7fe;
        }

        body {
            background-color: var(--bg-body);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1b2559;
        }

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: #ffffff;
            position: fixed;
            border-right: 1px solid #e2e8f0;
            padding: 25px;
        }

        .main-wrapper {
            margin-left: var(--sidebar-width);
            padding: 40px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: #a3aed0;
            border-radius: 12px;
            margin-bottom: 8px;
            font-weight: 600;
            text-decoration: none;
        }

        .nav-link.active {
            background: var(--bg-body);
            color: var(--primary);
        }

        .schedule-card {
            background: #ffffff;
            border-radius: 24px;
            border: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            overflow: hidden;
            max-width: 800px;
            margin: 0 auto;
        }

        .card-header-custom {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            padding: 30px;
        }

        .form-label {
            font-weight: 700;
            font-size: 0.85rem;
            color: #4a5568;
        }

        .btn-save {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="mb-5 px-3"><h4 class="fw-bold text-primary">BNM Admin</h4></div>
        <nav>
            <a href="{% url 'admin_viewbase' %}" class="nav-link"><i class="bi bi-grid-fill me-2"></i> Overview</a>
            <a href="{% url 'doctor_view' %}" class="nav-link"><i class="bi bi-people-fill me-2"></i> Doctor List</a>
            <a href="{% url 'add_schedule' %}" class="nav-link active"><i class="bi bi-calendar-plus me-2"></i> Add Schedule</a>
            <a href="{% url 'view_schedule' %}" class="nav-link"><i class="bi bi-calendar3 me-2"></i> View Schedules</a>
            <hr class="my-4 opacity-25">
            <a href="{% url 'logout_view' %}" class="nav-link text-danger"><i class="bi bi-box-arrow-left me-2"></i> Logout</a>
        </nav>
    </aside>


    <div class="main-wrapper">
        <a href="{% url 'admin_viewbase' %}" class="btn btn-outline-secondary rounded-pill">
                <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
            </a>
        <div class="schedule-card">
            <div class="card-header-custom">
                <h3 class="fw-bold mb-0"><i class="bi bi-clock-history me-2"></i>Set Duty Schedule</h3>
                <p class="mb-0 opacity-75">Assign on-duty hours and token limits to doctors.</p>
            </div>

            <div class="p-4 p-md-5">
                <form method="POST">
                    {% csrf_token %}

                    <div class="row g-4">
                        <div class="col-12">
                            <label class="form-label">Select Specialist</label>
                            {{ form.doctor }}
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Duty Date</label>
                            {{ form.date }}
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Max Token Capacity</label>
                            {{ form.max_tokens }}
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Shift Start Time</label>
                            {{ form.start_time }}
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Shift End Time</label>
                            {{ form.end_time }}
                        </div>
                    </div>

                    <div class="mt-5 d-flex justify-content-between align-items-center">
                        <a href="{% url 'view_schedule' %}" class="text-muted text-decoration-none small fw-bold">
                            <i class="bi bi-arrow-left me-1"></i> View All Schedules
                        </a>
                        <button type="submit" class="btn-save">
                            <i class="bi bi-calendar-check me-2"></i> Publish Schedule
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
