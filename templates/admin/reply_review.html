<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Reply | BOOK N MEET</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary: #0061ff; --text-dark: #1e293b; --patient-bg: #f0f7ff; }
        body { background-color: #f8faff; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-dark); }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); background: white; overflow: hidden; }
        .patient-review-header { background: var(--patient-bg); padding: 20px; border-bottom: 1px solid #e0edff; }
        .star-rating { color: #fbbf24; }
        .btn-reply { background: var(--primary); color: white; border-radius: 12px; padding: 12px 30px; font-weight: 700; border: none; transition: 0.3s; }
        .btn-reply:hover { background: #004ecc; transform: translateY(-2px); }
        .form-control { border-radius: 15px; border: 1px solid #e2e8f0; padding: 15px; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 97, 255, 0.1); }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="mb-4 d-flex align-items-center">
                <a href="javascript:history.back()" class="btn btn-white shadow-sm rounded-circle me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h3 class="fw-800 mb-0">Respond to Review</h3>
            </div>

            <div class="card card-custom">
                <div class="patient-review-header">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-primary rounded-pill small">Patient Feedback</span>
                        <small class="text-muted">{{ review.created_at|date:"M d, Y" }}</small>
                    </div>
                    <h5 class="fw-bold mb-1">{{ review.patient.name }}</h5>
                    <div class="star-rating mb-3">
                        {% for i in "12345"|make_list %}
                            <i class="bi bi-star{% if forloop.counter <= review.rating %}-fill{% endif %}"></i>
                        {% endfor %}
                    </div>
                    <p class="mb-0 text-secondary-emphasis" style="font-style: italic;">
                        "{{ review.comment }}"
                    </p>
                </div>

                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label fw-bold">Admin Response</label>
                            <textarea
                                name="reply_text"
                                class="form-control"
                                rows="6"
                                placeholder="Write a professional response to the patient..."
                                required>{{ review.reply|default:'' }}</textarea>
                            <div class="form-text mt-2">
                                <i class="bi bi-info-circle me-1"></i>
                                This reply will be visible to the patient and on the doctor's public profile.
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" onclick="history.back()" class="btn btn-light rounded-pill px-4">Cancel</button>
                            <button type="submit" class="btn-reply rounded-pill px-4">
                                <i class="bi bi-check2-circle me-2"></i>Post Official Reply
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
